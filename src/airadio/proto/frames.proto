// 本仓库自有的最小 protobuf 定义（proto3 忽略未知字段）。
// 字段号核对来源：
//  - chat/social/member/like/User：真实抓包 scripts/sample_frames.json（capture_frames.py 生成）
//  - GiftMessage/GiftStruct：上游通用定义（saermart/DouyinLiveWebFetcher douyin.proto；实测同类消息一致）
syntax = "proto3";

message PushFrame {
  uint64 seqId = 1;
  uint64 logId = 2;
  bytes payload = 8;
  string payloadType = 9;
}

message Message {
  string method = 1;
  bytes payload = 2;
  int64 msgId = 3;
  int64 offset = 4;
}

message Response {
  repeated Message messagesList = 1;
  string cursor = 2;
  uint64 fetchInterval = 3;
  uint64 now = 4;
  string internalExt = 5;
  uint32 fetchType = 6;
  uint64 heartbeatDuration = 8;
  bool needAck = 9;
}

message Common {
  string method = 1;
  uint64 msgId = 2;
  uint64 filterLabels = 15;
  uint64 showToAll = 17;
}

// 实测：f1=id(varint) f2=short_id(varint) f3=昵称(string) f9=头像。
message User {
  uint64 id = 1;
  string nickname = 3;
}

// 上游核对：GiftStruct f12=diamondCount, f16=name。
message GiftStruct {
  uint64 diamond_count = 12;
  string name = 16;
}

message ChatMessage {
  Common common = 1;
  User user = 2;
  string content = 3;
}

message EmojiChatMessage {
  Common common = 1;
  User user = 2;
  string content = 3;
  uint64 emoji_count = 4;
}

// 实测：action=f4(1关注/2取关)，followCount=f6。
message SocialMessage {
  Common common = 1;
  User user = 2;
  uint64 action = 4;
  uint64 followCount = 6;
}

message MemberMessage {
  Common common = 1;
  User user = 2;
}

// 实测：count=f2, total=f3, user=f5。
message LikeMessage {
  Common common = 1;
  uint64 count = 2;
  uint64 total = 3;
  User user = 5;
}

// 上游核对：user=7, repeat_count=5(string), gift=15。
message GiftMessage {
  Common common = 1;
  string repeat_count = 5;
  User user = 7;
  GiftStruct gift = 15;
}
