[project]
name = "airadio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dashscope>=2.0.3",
    "grpcio-tools>=1.85.1",
    "mini-racer>=0.14.1",
    "protobuf>=7.36.2",
    "requests>=2.34.2",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
